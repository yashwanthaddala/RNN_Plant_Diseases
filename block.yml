version: 1
type: learning
name: RNN_Plant_Detector
description: Custom RNN training block for plant disease classification

docker:
  image: "<your-dockerhub-username>/<your-repo>:latest"
  username: "$DOCKERHUB_USERNAME"
  password: "$DOCKERHUB_PASSWORD"

src: https://github.com/yashwanthaddala/RNN_Plant_Diseases.git

entrypoint: model_train.py

model:
  load_model: load_model
  train: train
  evaluate: evaluate

parameters:
  epochs:
    type: int
    default: 20
  batch_size:
    type: int
    default: 32

